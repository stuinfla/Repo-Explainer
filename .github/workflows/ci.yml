# The test gate — ONE definition, used two ways: on every pull request and push to main (so a red suite
# cannot merge unnoticed), and called by release.yml before it will publish anything.
#
# Why: the tests used to run ONLY when a release tag was pushed, so a red suite could merge unnoticed.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # --ignore-scripts: dependency install hooks never run in CI (supply-chain posture).
      - run: npm ci --ignore-scripts

      # The ask-service has its own manifest (it deploys as a separate Netlify site); its tests import it.
      - run: npm ci --ignore-scripts --prefix ask-service

      # The diagram tests spawn make-diagrams, which shells out to `xmllint` to validate every SVG. A bare
      # runner does not have it; system deps here must mirror what the tools invoke (nothing calls `dot`).
      # imagemagick: make-social-card renders the share card with it; without it the card-legibility tests SKIP.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils imagemagick

      - run: npm test

      # End-to-end suite (real embeddings + RVF stores in a temp dir; downloads the small bge model on a fresh runner).
      - run: npm run test:e2e
