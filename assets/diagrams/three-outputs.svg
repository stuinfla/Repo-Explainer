<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 486" width="600" height="486" role="img" aria-labelledby="outputs-t outputs-d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title id="outputs-t">One GitHub URL in, three artifacts out</title>
  <desc id="outputs-d">One GitHub repo URL goes into explainmyrepo. Out come a live explainer page and a downloadable AI knowledge pack from either door, plus a GitHub repo you own from the local door.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect x="0" y="0" width="600" height="486" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="300" y="36" fill="#7dd3fc" font-size="16" font-weight="bold" text-anchor="middle">one GitHub URL in, three things out</text>
  <rect x="150" y="52" width="300" height="44" rx="10" fill="#111c33" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="80" fill="#e2e8f0" font-size="14" text-anchor="middle">github.com/owner/name</text>
  <line x1="300" y1="96" x2="300" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="150" y="124" width="300" height="44" rx="10" fill="#111c33" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="300" y="152" fill="#7dd3fc" font-size="15" font-weight="bold" text-anchor="middle">explainmyrepo</text>
  <line x1="300" y1="172" x2="300" y2="194" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="196" width="560" height="76" rx="10" fill="#111c33" stroke="#34d399" stroke-width="1.5"/>
  <text x="36" y="224" fill="#34d399" font-size="15" font-weight="bold">1 · a live explainer page</text>
  <text x="36" y="246" fill="#e2e8f0" font-size="13">the link you share; real diagrams drawn from the code</text>
  <text x="36" y="264" fill="#94a3b8" font-size="13">both doors</text>
  <line x1="300" y1="272" x2="300" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="296" width="560" height="76" rx="10" fill="#111c33" stroke="#34d399" stroke-width="1.5"/>
  <text x="36" y="324" fill="#34d399" font-size="15" font-weight="bold">2 · an AI knowledge pack</text>
  <text x="36" y="346" fill="#e2e8f0" font-size="13">a .zip: vector KB + search CLI + MCP server</text>
  <text x="36" y="364" fill="#94a3b8" font-size="13">both doors</text>
  <line x1="300" y1="372" x2="300" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="396" width="560" height="76" rx="10" fill="#111c33" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="36" y="424" fill="#fbbf24" font-size="15" font-weight="bold">3 · a GitHub repo you own</text>
  <text x="36" y="446" fill="#e2e8f0" font-size="13">you are invited as collaborator</text>
  <text x="36" y="464" fill="#94a3b8" font-size="13">local door only</text>
</svg>
