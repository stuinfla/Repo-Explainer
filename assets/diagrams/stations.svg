  <rect x="34" y="614" width="22" height="14" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="64" y="626" fill="#94a3b8" font-size="13">solid: a failure stops the build</text>
  <rect x="34" y="638" width="22" height="14" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="650" fill="#94a3b8" font-size="13">dashed: advisory, the build carries on</text>
  <text x="34" y="674" fill="#94a3b8" font-size="13">L: local door only</text>
</svg>
