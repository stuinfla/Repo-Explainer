  <rect x="20" y="504" width="560" height="94" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="34" y="528" fill="#7dd3fc" font-size="15" font-weight="bold">4 · follow-ups</text>
  <text x="173.05" y="528" fill="#94a3b8" font-size="13">after delivery, never block it</text>
