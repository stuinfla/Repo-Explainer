  <g data-station="quality-grade" data-fatal="true" data-doors="local,hosted">
  <rect x="34" y="316" width="121" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="43" y="335" fill="#e2e8f0" font-size="13">quality-grade</text>
