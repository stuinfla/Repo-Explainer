  <rect x="20" y="168" width="560" height="202" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="34" y="192" fill="#7dd3fc" font-size="15" font-weight="bold">2 · build + grade</text>
  <text x="200.275" y="192" fill="#94a3b8" font-size="13">author, draw, assemble, pack, grade</text>
  <g data-station="primer" data-fatal="true" data-doors="local,hosted">
  <rect x="34" y="208" width="66" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="43" y="227" fill="#e2e8f0" font-size="13">primer</text>
