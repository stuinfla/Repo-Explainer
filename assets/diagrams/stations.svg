  <text x="187" y="563" fill="#e2e8f0" font-size="13">redeploy L</text>
  </g>
  <g data-station="republish" data-fatal="false" data-doors="local">
  <rect x="283" y="544" width="105" height="28" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="292" y="563" fill="#e2e8f0" font-size="13">republish L</text>
