  <rect x="20" y="390" width="560" height="94" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="34" y="414" fill="#7dd3fc" font-size="15" font-weight="bold">3 · ship</text>
  <text x="118.6" y="414" fill="#94a3b8" font-size="13">deploy, then tell people</text>
