<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 692" width="600" height="692" role="img" aria-labelledby="stations-t stations-d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title id="stations-t">The one station table</title>
  <desc id="stations-d">The build is one ordered list of stations in four phases: set up, build and grade, ship, and follow-ups after delivery. Solid outline stations stop the build if they fail; dashed outline stations are advisory. Stations marked L run on the local door only.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect x="0" y="0" width="600" height="692" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="300" y="34" fill="#7dd3fc" font-size="16" font-weight="bold" text-anchor="middle">one station table (src/stations.mjs)</text>
  <rect x="20" y="54" width="560" height="94" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="34" y="78" fill="#7dd3fc" font-size="15" font-weight="bold">1 · set up</text>
  <text x="136.75" y="78" fill="#94a3b8" font-size="13">clone the exact repo, build the KB</text>
  <g data-station="clone-repo" data-fatal="true" data-doors="local,hosted">
  <rect x="34" y="94" width="97" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="43" y="113" fill="#e2e8f0" font-size="13">clone-repo</text>
  </g>
  <g data-station="kb:register" data-fatal="true" data-doors="local,hosted">
  <rect x="139" y="94" width="105" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="148" y="113" fill="#e2e8f0" font-size="13">kb:register</text>
  </g>
  <g data-station="build-kb" data-fatal="true" data-doors="local,hosted">
  <rect x="252" y="94" width="81" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="261" y="113" fill="#e2e8f0" font-size="13">build-kb</text>
  </g>
  <g data-station="concept-tournament" data-fatal="false" data-doors="local,hosted">
  <rect x="341" y="94" width="160" height="28" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="113" fill="#e2e8f0" font-size="13">concept-tournament</text>
