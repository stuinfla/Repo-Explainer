<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 458" width="600" height="458" role="img" aria-labelledby="loop-t loop-d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title id="loop-t">What each build leaves behind</title>
  <desc id="loop-d">Every hosted build records its measured outcome, and readers can add their own 1 to 100 grade. Both go to a local learning store. Lessons are then written into the skill, the gate and the tools so the next build starts from them.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect x="0" y="0" width="600" height="458" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="300" y="34" fill="#7dd3fc" font-size="16" font-weight="bold" text-anchor="middle">what each build leaves behind</text>
  <rect x="20" y="54" width="560" height="82" rx="10" fill="#111c33" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="36" y="80" fill="#7dd3fc" font-size="15" font-weight="bold">a shipped page</text>
  <text x="36" y="100" fill="#e2e8f0" font-size="13">its scorecard, cost, weakest axis and the form of each diagram are</text>
  <text x="36" y="119" fill="#e2e8f0" font-size="13">recorded with the result</text>
  <line x1="300" y1="136" x2="300" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="156" width="560" height="82" rx="10" fill="#111c33" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="36" y="182" fill="#7dd3fc" font-size="15" font-weight="bold">the reader's own grade</text>
  <text x="36" y="202" fill="#e2e8f0" font-size="13">the delivery email links a 30-second 1-100 grade with comments; npm</text>
  <text x="36" y="221" fill="#e2e8f0" font-size="13">run pull-ratings brings them into the store</text>
  <line x1="300" y1="238" x2="300" y2="254" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="258" width="560" height="82" rx="10" fill="#111c33" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="36" y="284" fill="#7dd3fc" font-size="15" font-weight="bold">the learning store</text>
  <text x="36" y="304" fill="#e2e8f0" font-size="13">both verdicts land side by side in a local ruflo memory namespace,</text>
  <text x="36" y="323" fill="#e2e8f0" font-size="13">and the admin page plots the trend</text>
  <line x1="300" y1="340" x2="300" y2="356" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="360" width="560" height="82" rx="10" fill="#111c33" stroke="#34d399" stroke-width="1.5"/>
  <text x="36" y="386" fill="#34d399" font-size="15" font-weight="bold">the recipe changes</text>
  <text x="36" y="406" fill="#e2e8f0" font-size="13">when a failure teaches something, the skill, the gate or a tool is</text>
  <text x="36" y="425" fill="#e2e8f0" font-size="13">changed so the fix fires on every later build</text>
</svg>
